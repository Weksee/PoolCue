<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мини-бар — Pool&amp;Cue</title>
<meta name="description" content="Мини-бар Pool&Cue: напитки, коктейли и закуски с заказом прямо к столу.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23150c07' stroke='%23d3a54a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f1e6d1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/utilities.css">
<script src="js/data.js"></script>
<script src="js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>

<nav class="crumbs container" aria-label="Хлебные крошки" data-trail="Мини-бар"></nav>
<div class="container page-head"><h1 class="page-head__title">Мини-бар</h1><p class="page-head__lead">Соберите заказ, укажите, где вы сидите, и официант принесёт всё к столу. Оплата в клубе.</p></div>
<div class="container"><nav class="tabs" aria-label="Разделы каталога"><a class="tabs__link" href="catalog.html"><span class="tabs__title">Столы</span><span class="tabs__text">Русский бильярд, пул, снукер</span></a><a class="tabs__link" href="sports.html"><span class="tabs__title">Спорт-залы</span><span class="tabs__text">Матчи на экранах и стол рядом</span></a><a class="tabs__link tabs__link--active" href="menu.html" aria-current="page"><span class="tabs__title">Мини-бар</span><span class="tabs__text">Напитки и закуски к столу</span></a></nav></div>
<div class="container grid gap-8 pb-8 lg:grid-cols-[1fr_380px]">
  <section><div class="cat-row chips" id="cats"></div><div class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3" id="menuGrid"></div></section>
  <aside class="cart" id="cart"><div class="form-panel" id="cartBox"><h2 class="text-2xl mb-3">Ваш заказ</h2><div id="lines"></div>
    <form id="orderForm" novalidate class="grid gap-4 mt-4" hidden>
      <div class="field"><label class="field__label" for="oName">Имя</label><input class="field__input" id="oName" data-rule="required minlen:2"></div>
      <div class="field"><label class="field__label" for="oPhone">Телефон</label><input class="field__input" id="oPhone" type="tel" data-rule="required phone" placeholder="+7 900 123-45-67"></div>
      <div class="field"><label class="field__label" for="oWhere">Куда принести</label><select class="field__input" id="oWhere"></select></div>
      <div class="field"><label class="field__label" for="oNote">Пожелания</label><textarea class="field__input" id="oNote" style="min-height:64px" placeholder="Например, без льда"></textarea></div>
      <div class="field field--check" id="ageBox" hidden><input type="checkbox" id="oAge"><label for="oAge" class="text-sm">Мне есть 18 лет, подтверждаю заказ алкоголя</label></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Заказать</button></form></div></aside>
</div>
<a class="btn btn--primary cart-pill" href="#cart" id="pill">Заказ</a>

</main>
<div id="site-footer"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{

let cart={},cat="all";try{cart=JSON.parse(localStorage.getItem("pc_cart")||"{}")}catch(_){}
const save=()=>{try{localStorage.setItem("pc_cart",JSON.stringify(cart))}catch(_){}};
$("#cats").innerHTML=[["all","Всё меню"],...MENU_CATS.map(c=>[c,c])].map(([v,t],i)=>`<label class="chip"><input type="radio" name="cat" value="${v}"${i?"":" checked"}><span>${t}</span></label>`).join("");
$("#oWhere").innerHTML=["У барной стойки",...SPORT_HALLS.map(h=>"Спорт-зал "+h.name),...TABLES.map(t=>`Стол «${t.name}», ${t.hall}`)].map(o=>`<option>${o}</option>`).join("");
const ctl=id=>{const n=cart[id]||0;return n?`<div class="qty"><button data-dec="${id}" aria-label="Убрать одну">−</button><b>${n}</b><button data-inc="${id}" aria-label="Добавить ещё">+</button></div>`:`<button class="btn btn--primary btn--sm" data-inc="${id}">В заказ</button>`};
function grid(){$("#menuGrid").innerHTML=MENU.filter(m=>cat==="all"||m.cat===cat).map(m=>`<article class="card"><div class="card__media"><img src="images/${m.img}" alt="${m.name}" loading="lazy">${m.alc?'<div class="card__badges"><span class="badge badge--hot">18+</span></div>':""}</div><div class="card__body"><p class="card__meta">${m.cat}, ${m.vol}</p><h3 class="card__title">${m.name}</h3><p class="card__text">${m.desc}</p><div class="card__foot"><p class="card__price">${money(m.price)}</p><span data-ctl="${m.id}">${ctl(m.id)}</span></div></div></article>`).join("")}
function lines(){const items=MENU.filter(m=>cart[m.id]),sum=items.reduce((s,m)=>s+m.price*cart[m.id],0),cnt=items.reduce((s,m)=>s+cart[m.id],0);
$("#lines").innerHTML=items.length?items.map(m=>`<div class="cart__line"><span>${m.name} × ${cart[m.id]}</span><b>${money(m.price*cart[m.id])}</b></div>`).join("")+`<div class="sum__row sum__row--total mt-3"><span>Итого</span><span>${money(sum)}</span></div>`:`<p class="text-[color:var(--muted)]">Пока пусто. Добавьте напитки или закуски из меню.</p>`;
$("#orderForm").hidden=!items.length;const alc=items.some(m=>m.alc);$("#ageBox").hidden=!alc;if(alc)$("#oAge").dataset.rule="agree";else{delete $("#oAge").dataset.rule;$("#oAge").checked=false}
$("#pill").textContent=cnt?`Заказ: ${cnt} · ${money(sum)}`:"Заказ пуст";return sum}
document.addEventListener("click",e=>{const b=e.target.closest("[data-inc],[data-dec]");if(!b)return;const id=b.dataset.inc||b.dataset.dec;
cart[id]=Math.max(0,(cart[id]||0)+(b.dataset.inc?1:-1));if(!cart[id])delete cart[id];save();$$(`[data-ctl="${id}"]`).forEach(s=>s.innerHTML=ctl(id));lines()});
$$("input[name=cat]").forEach(r=>r.onchange=()=>{cat=r.value;grid()});
$("#orderForm").onsubmit=e=>{e.preventDefault();if(!validateForm(e.target)){toast("Проверьте поля формы: есть ошибки",true);return}
const sum=lines(),code="BAR-"+Math.floor(100+Math.random()*900),where=$("#oWhere").value;cart={};save();
$("#cartBox").innerHTML=`<div class="text-center py-4"><div class="feature__icon mx-auto" style="width:4rem;height:4rem">${icon("bar")}</div><h2 class="text-2xl">Заказ принят</h2><p class="mt-3">Номер: <b class="text-[color:var(--brass-light)]">${code}</b></p><p class="mt-2 text-[color:var(--muted)]">Принесём: ${where.toLowerCase()}. К оплате в клубе: ${money(sum)}.</p><a class="btn btn--ghost mt-6" href="menu.html">Сделать новый заказ</a></div>`;$("#pill").hidden=true;toast("Заказ принят, официант уже в пути")};
grid();lines();

});
</script>
</body>
</html>
