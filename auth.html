<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход и регистрация — Pool&amp;Cue</title>
<meta name="description" content="Вход и регистрация в Pool&Cue: доступ к онлайн-бронированию столов.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23150c07' stroke='%23d3a54a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f1e6d1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/utilities.css">
<script src="js/data.js"></script>
<script src="js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>

<nav class="crumbs container" aria-label="Хлебные крошки" data-trail="Вход и регистрация"></nav>
<section class="container auth">
  <div class="auth__side"><h1 class="page-head__title">Личный кабинет</h1><p>Войдите, чтобы бронировать столы, заказывать из мини-бара и следить за своими бронями.</p>
    <ul class="list-check"><li>Бронирование и отмена в один клик</li><li>История броней и заказов бара</li><li>Лист ожидания на занятые столы</li><li>Отзывы после игры</li></ul></div>
  <div class="form-panel" id="authBox">
    <div class="chips auth__tabs"><label class="chip"><input type="radio" name="tab" value="login" checked><span>Вход</span></label><label class="chip"><input type="radio" name="tab" value="register"><span>Регистрация</span></label></div>
    <form id="loginForm" class="auth__form" novalidate>
      <div class="field"><label class="field__label" for="lMail">Электронная почта</label><input class="field__input" id="lMail" type="email" autocomplete="email" data-rule="required email" placeholder="name@mail.ru"></div>
      <div class="field"><label class="field__label" for="lPass">Пароль</label><input class="field__input" id="lPass" type="password" autocomplete="current-password" data-rule="required"></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Войти</button></form>
    <form id="regForm" class="auth__form" novalidate hidden>
      <div class="field"><label class="field__label" for="rName">Имя</label><input class="field__input" id="rName" autocomplete="name" data-rule="required minlen:2"></div>
      <div class="field"><label class="field__label" for="rMail">Электронная почта</label><input class="field__input" id="rMail" type="email" autocomplete="email" data-rule="required email" placeholder="name@mail.ru"></div>
      <div class="field"><label class="field__label" for="rPhone">Телефон</label><input class="field__input" id="rPhone" type="tel" autocomplete="tel" data-rule="required phone" placeholder="+7 900 123-45-67"></div>
      <div class="field"><label class="field__label" for="rPass">Пароль</label><input class="field__input" id="rPass" type="password" autocomplete="new-password" data-rule="required minlen:6" placeholder="Не короче 6 символов"></div>
      <div class="field"><label class="field__label" for="rPass2">Повторите пароль</label><input class="field__input" id="rPass2" type="password" autocomplete="new-password" data-rule="required"></div>
      <div class="field field--check"><input type="checkbox" id="rAgree" data-rule="agree"><label for="rAgree" class="text-sm">Согласен на обработку данных и правила клуба</label></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Создать аккаунт</button></form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{

const q=new URLSearchParams(location.search),nx=q.get("next")||"",next=/^[\w-]+\.html(\?[\w=&%.\-]*)?$/.test(nx)?nx:"account.html",me=Auth.me();
if(me){$("#authBox").innerHTML=`<h2 class="text-2xl mb-3">Вы уже вошли</h2><p>${esc(me.name)}, ${esc(me.email)}</p><div class="flex flex-wrap gap-3" style="margin-top:1.2rem"><a class="btn btn--primary" href="account.html">Мои брони</a><button class="btn btn--ghost" id="out" type="button">Выйти</button></div>`;$("#out").onclick=()=>{Auth.logout();location.reload()};return}
const lf=$("#loginForm"),rf=$("#regForm");
function tab(v){lf.hidden=v!=="login";rf.hidden=v!=="register";$(`input[name=tab][value=${v}]`).checked=true}
$$("input[name=tab]").forEach(r=>r.onchange=()=>tab(r.value));tab(q.get("tab")==="register"?"register":"login");
lf.onsubmit=e=>{e.preventDefault();if(!validateForm(lf))return;const err=Auth.login($("#lMail").value,$("#lPass").value);if(err){setError($("#lPass"),err);return}location.href=next};
rf.onsubmit=e=>{e.preventDefault();let ok=validateForm(rf);if(ok&&$("#rPass").value!==$("#rPass2").value){setError($("#rPass2"),"Пароли не совпадают");ok=false}if(!ok)return;
const err=Auth.register({name:$("#rName").value,email:$("#rMail").value,phone:$("#rPhone").value,pass:$("#rPass").value});if(err){setError($("#rMail"),err);return}location.href=next};

});
</script>
</body>
</html>
