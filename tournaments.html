<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Турниры и акции — Pool&amp;Cue</title>
<meta name="description" content="Расписание турниров и акции бильярдного клуба Pool&Cue: скидки, абонементы и подарки.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23150c07' stroke='%23d3a54a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f1e6d1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/utilities.css">
<script src="js/data.js"></script>
<script src="js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>

<nav class="crumbs container" aria-label="Хлебные крошки" data-trail="Турниры и акции"></nav>
<div class="container page-head"><h1 class="page-head__title">Турниры и акции</h1><p class="page-head__lead">Играйте на призы и экономьте на каждой партии. Запись на турнир занимает минуту.</p></div>
<section class="container grid gap-10 pb-10 lg:grid-cols-[1.4fr_1fr]">
  <div><img class="mb-6 rounded-3xl w-full" style="aspect-ratio:16/7;object-fit:cover;background:radial-gradient(circle,var(--oak),var(--walnut-800))" src="images/tournament-banner.png" alt="Финал турнира: два игрока у стола под лампой"><h2 class="section__title mb-5">Расписание</h2><div class="grid gap-4" id="events"></div></div>
  <div><h2 class="section__title mb-5">Акции</h2><div class="grid gap-4" id="promos"></div></div>
</section>
<section class="section section--dark"><div class="container max-w-3xl"><h2 class="section__title mb-6">Частые вопросы</h2><div id="faq"></div></div></section>

</main>
<div id="site-footer"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{

$("#events").innerHTML=TOURNAMENTS.map((e,i)=>`<div class="event"><div class="event__date"><span>${e.d}<small>${e.m}</small></span></div><div><h3 class="event__title">${e.title}</h3><p class="event__meta">${e.meta}</p><p class="mt-1 text-sm text-[color:var(--ok)]">${e.seats}</p></div><button class="btn btn--primary btn--sm" data-reg="${i}">Записаться</button></div>`).join("");
$("#promos").innerHTML=PROMOS.map(p=>`<div class="promo"><p class="promo__big">${p.big}</p><h3 class="text-xl mt-1">${p.t}</h3><p class="mt-1 text-sm">${p.d}</p></div>`).join("");
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-reg]");if(!b)return;const e=TOURNAMENTS[b.dataset.reg];
const m=openModal(`<form class="modal__body" novalidate><h3 class="text-2xl">Запись: ${e.title}</h3><p class="text-sm text-[color:var(--muted)]">${e.d} ${e.m}. ${e.meta}</p><div class="field"><label class="field__label" for="rName">Имя</label><input class="field__input" id="rName" data-rule="required minlen:2"></div><div class="field"><label class="field__label" for="rPhone">Телефон</label><input class="field__input" id="rPhone" type="tel" data-rule="required phone" placeholder="+7 900 123-45-67"></div><div class="field"><label class="field__label" for="rLevel">Уровень игры</label><select class="field__input" id="rLevel"><option>Новичок</option><option>Любитель</option><option>Опытный игрок</option></select></div><button class="btn btn--primary" type="submit">Отправить заявку</button></form>`);
$("form",m).onsubmit=s=>{s.preventDefault();if(!validateForm(s.target)){toast("Проверьте поля формы",true);return}m.close();toast(`Заявка на «${e.title}» отправлена`)}});
const fq=$("#faq");if(fq)fq.innerHTML=FAQ.map(([q,a])=>`<details class="faq"><summary class="faq__q">${q}</summary><p class="faq__a">${a}</p></details>`).join("");
});
</script>
</body>
</html>
